name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  check-version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Tag must match every workspace package
        run: |
          python3 - <<'PY'
          import os, pathlib, tomllib
          tag = os.environ['GITHUB_REF_NAME'].removeprefix('v')
          for name in ['Client/Windows', 'Server', 'shared']:
              path = pathlib.Path(name) / 'Cargo.toml'
              version = tomllib.loads(path.read_text())['package']['version']
              assert version == tag, f'{path}: {version} does not match tag {tag}'
          PY
  build:
    needs: check-version
    uses: ./.github/workflows/build.yml
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: rusttalk-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
