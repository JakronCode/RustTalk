name: Docker
# Pull requests: build the server image for linux/amd64 and linux/arm64 and smoke-test it.
# Nothing is pushed and no secrets are used; release.yml publishes the image on version tags.
on:
  pull_request:
    paths:
      - "Server/**"
      - "shared/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Client/Windows/Cargo.toml"
      - ".dockerignore"
      - "Makefile"
      - ".github/workflows/docker.yml"
      - ".github/workflows/release.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Compose examples
        run: make compose-check
      - name: Build linux/amd64 for the smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Server/Dockerfile
          platforms: linux/amd64
          load: true
          tags: rusttalk-server:ci
      - name: Smoke test
        run: bash Server/Test_Scripts/docker_smoke.sh rusttalk-server:ci
      # arm64 is cross-compiled in the builder stage, no emulation needed.
      - name: Build linux/amd64 + linux/arm64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
