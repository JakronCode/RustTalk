[package]
name = "rusttalk-server"
version = "0.2.0"
edition = "2021"

[[bin]]
name = "rusttalk-server"
path = "src/main.rs"

[dependencies]
rusttalk-shared = { path = "../shared" }
tokio = { version = "1", features = ["full"] }
# Keepalive + TCP_USER_TIMEOUT (tote Verbindungen erkennen)
socket2 = { version = "0.6", features = ["all"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
rand = "0.9"
rusqlite = { version = "0.32", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
