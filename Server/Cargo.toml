[package]
name = "rusttalk-server"
version = "0.6.0"
edition = "2021"

[[bin]]
name = "rusttalk-server"
path = "src/main.rs"

[dependencies]
rusttalk-shared = { path = "../shared" }
tokio = { version = "1", features = ["full"] }
# Keepalive + TCP_USER_TIMEOUT (tote Verbindungen erkennen)
socket2 = { version = "0.6", features = ["all"] }
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
toml = "0.8"
rand = "0.9"
rusqlite = { version = "0.32", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
# GIF search (GIPHY) – the key stays on the server
ureq = { version = "2", features = ["json"] }
serde_json = "1"
# Identity hashes
sha2 = "0.10"
# TLS for the control connection (ring backend, own self-signed certificate)
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
