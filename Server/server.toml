# RustTalk Server-Konfiguration
# Wird dem Server-Binary als Argument uebergeben: rusttalk-server server.toml

bind_address = "0.0.0.0:7331"   # TCP und UDP auf gleichem Port
server_name = "Mein RustTalk Server"
max_clients = 32
# password = "geheim"           # optionaler Passwort-Schutz

# SQLite-Persistenz: Channels, Chat-Verlauf und Spawn-Log ueberleben Neustarts.
# Retention: max. 10.000 Nachrichten pro Text-Channel (groessen-gedeckelt).
persist_state = true
db_path = "/opt/rusttalk/server/rusttalk.db"

# Der Spawn-Channel ist optional - ohne Eintrag wird "Spawn" automatisch erstellt.
# Genau EINER pro Server. Hier landen alle beim Verbinden (Sprechverbot, Join-Log).
[[channels]]
name = "Spawn"
kind = "spawn"

[[channels]]
name = "Text"
kind = "category"

[[channels]]
name = "allgemein"
kind = "text"
category = "Text"

[[channels]]
name = "info"
kind = "text"
category = "Text"

[[channels]]
name = "Voice-Area"
kind = "category"

[[channels]]
name = "Funkturm 116"
kind = "voice"                  # kind darf weggelassen werden (Default: voice)
category = "Voice-Area"

[[channels]]
name = "Gaming"
kind = "voice"
category = "Voice-Area"
