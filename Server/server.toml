# RustTalk server configuration
# Passed to the server binary as argument: rusttalk-server server.toml

bind_address = "0.0.0.0:7331"   # TCP and UDP on the same port
server_name = "RustTalk Server"
max_clients = 32
# password = "secret"           # optional password protection
# admin_password = "boss"       # optional: whoever enters it (Server Settings > Roles) becomes admin

# SQLite persistence: channels (incl. order), chat history and lobby log
# survive restarts. Retention: max. 10,000 messages per text channel.
persist_state = true
db_path = "/opt/rusttalk/server/rusttalk.db"

# Initial channel layout. With persistence enabled this is only used on the
# very FIRST start (empty database). After that the database is the source of
# truth: channels created, renamed or reordered in the app are kept.
#
# The lobby (kind = "spawn") is optional - without an entry "Lobby" is created
# automatically. Exactly ONE per server. Everyone lands here when connecting
# (no talking, join log).
[[channels]]
name = "Lobby"
kind = "spawn"

[[channels]]
name = "Text Channels"
kind = "category"

[[channels]]
name = "general"
kind = "text"
category = "Text Channels"

[[channels]]
name = "announcements"
kind = "text"
category = "Text Channels"

[[channels]]
name = "Voice Channels"
kind = "category"

[[channels]]
name = "Lounge"
kind = "voice"                  # kind may be omitted (default: voice)
category = "Voice Channels"

[[channels]]
name = "Gaming"
kind = "voice"
category = "Voice Channels"
