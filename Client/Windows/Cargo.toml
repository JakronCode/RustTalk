[package]
name = "rusttalk-client"
version = "0.10.1"
edition = "2021"

[[bin]]
name = "rusttalk"
path = "src/main.rs"

[dependencies]
rusttalk-shared = { path = "../../shared" }
eframe = "0.31"
egui-phosphor = "0.9"
nnnoiseless = "0.5"
cpal = "0.15"
# Medien: Bilder, Kamera, Bildschirm, GIFs
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "ico"] }
rfd = "0.15"
ureq = { version = "2", features = ["json"] }
serde_json = "1"
sha2 = "0.10"
# Identity secret
getrandom = "0.3"
# Echo cancellation (pure Rust port of WebRTC AEC3)
aec3 = "0.4"
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "download-binaries", "tls-native", "api-31"] }
unicode-normalization = "0.1"
# H.264 video (OpenH264 built from source, needs only a C++ compiler)
openh264 = "0.9"
# SIMD scaling of screen/camera pictures before encoding (~10x faster than image::thumbnail)
fast_image_resize = "6.1"
# TLS for the control connection
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
audiopus = "=0.3.0-rc.0"
ringbuf = "0.4"
tokio = { version = "1", features = ["net", "time", "io-util", "sync", "rt", "macros", "process"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
syntect = { version = "5.3", default-features = false, features = ["parsing", "regex-fancy", "dump-load"] }

# Windows-only capture and desktop integration are omitted from the Linux client.
[target.'cfg(windows)'.dependencies]
nokhwa = { version = "0.10", features = ["input-msmf"] }
xcap = "0.9"
device_query = "4"
tauri-winrt-notification = "0.8"
windows = { version = "0.62", features = ["Media_Core", "Media_SpeechSynthesis", "Storage_Streams", "Foundation_Collections", "System_UserProfile"] }
winreg = "0.55"
mslnk = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.11", default-features = false, features = ["async-std"] }
tempfile = "3"
futures-util = "0.3"
notify-rust = "4"
gstreamer = "0.24"
gstreamer-app = "0.24"
gstreamer-video = "0.24"

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
