[package]
name = "rusttalk-shared"
version = "0.5.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
tokio = { version = "1", features = ["io-util"] }
# Encryption: TLS (ring backend - builds with a plain C compiler, no cmake/nasm),
# ChaCha20-Poly1305 for audio packets, SHA-256 fingerprints
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
chacha20poly1305 = "0.10"
sha2 = "0.10"
getrandom = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "io-util"] }
